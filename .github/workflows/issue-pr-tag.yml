
name: "Issue/PR Tag"
on:
  workflow_call:
    inputs:
      org_name:
        required: true
        type: string
      tag_team:
        required: true
        type: string
      issue: 
        required: false
        type: string
      pr: 
        required: false
        type: string
    secrets:
      token:
        required: true

permissions:
  contents: read

jobs:
  notify:
    if: ${{ github.repository_owner == inputs.org_name }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: devops-actions/issue-comment-tag@d142a09c7661623a1f80b4267ee80ee321c20e3c # v1.0.0
        with:
          team: ${{ inputs.tag_team }}
          issue: ${{ inputs.issue }}
          pr: ${{ inputs.pr }}
          owner: ${{ github.repository_owner }}
          repo: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.token }}
