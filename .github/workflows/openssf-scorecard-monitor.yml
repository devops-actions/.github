name: "OpenSSF Scorecard Monitor"
on: 
  push:
    # Only run on main: this workflow opens a PR with report updates against the
    # checked-out branch. Running it on other branches (e.g. Dependabot PR branches,
    # whose rebases can match the path filter below) would open PRs against them.
    branches:
      - main
    paths:
    - .github/workflows/openssf-scorecard-monitor.yml
    # Rebuild the README table as soon as a scope update (from update-scope.yml) lands.
    - ossf-reporting/scope.json
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scoring:
    runs-on: ubuntu-latest
    permissions:
      # Read only: report updates go through a PR opened with the org GitHub App token,
      # because main requires a PR with passing checks (a direct push is rejected).
      contents: read
      # Write access in order to create issues
      issues: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Close old OpenSSF Scorecard Report issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get all open issues with the title "OpenSSF Scorecard Report Updated!"
          echo "Searching for old OpenSSF Scorecard Report issues..."
          issue_numbers=$(gh issue list --state open --search '"OpenSSF Scorecard Report Updated!" in:title' --json number --jq '.[].number')
          
          if [ -n "$issue_numbers" ]; then
            echo "Found issues to close:"
            echo "$issue_numbers"
            while IFS= read -r issue_number; do
              if [ -n "$issue_number" ]; then
                echo "Closing issue #$issue_number"
                gh issue close "$issue_number" --comment "Closing this report as a new OpenSSF Scorecard report has been generated." || echo "Failed to close issue #$issue_number"
              fi
            done <<< "$issue_numbers"
          else
            echo "No old issues found to close."
          fi
      
      - name: OpenSSF Scorecard Monitor
        uses: ossf/scorecard-monitor@a3a9c4cfa0684480ec5f86fa178fc22c4394b69e # v2.0.0-beta8
        with:
          scope: ossf-reporting/scope.json
          database: ossf-reporting/database.json
          report: ossf-reporting/openssf-scorecard-report.md
          # Committed through the PR at the end of this job instead (main rejects direct pushes).
          auto-commit: false
          auto-push: false
          generate-issue: true
          # The token is needed to create issues, discovery mode and pushing changes in files
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # The scope comes only from update-scope.yml, which scans the org for action.yml
          # files; discovery would add other repos (e.g. ones without an action) to it.
          discovery-enabled: false
      
      - name: Fetch dependents counts
        uses: devops-actions/load-dependents-count@0d262a83629049daf94663490d021533d77da695 # v0.0.2
        with:
          scope-file: ossf-reporting/scope.json
          output-file: ossf-reporting/repo-usage.json

      - name: Fetch stars and forks counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching stars and forks for repos in scope..."
          python3 .github/scripts/fetch-stars-forks.py

      - name: Update README files with scorecard data
        run: |
          echo "Updating README files with scorecard information..."
          python3 .github/scripts/update-readme-scorecard.py

      # A PR opened with GITHUB_TOKEN would not trigger the required checks on main, so
      # use the org GitHub App token: the checks run and auto-merge lands the PR.
      - name: Get GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DEVOPS_ACTIONS_APPLICATION_ID }}
          private-key: ${{ secrets.DEVOPS_ACTIONS_APPLICATION_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create Pull Request with the report updates
        id: cpr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          commit-message: 'chore: update profile README with latest OpenSSF Scorecard data'
          title: 'chore: Update OpenSSF Scorecard report and profile README'
          add-paths: |
            profile/README.md
            ossf-reporting/database.json
            ossf-reporting/openssf-scorecard-report.md
            ossf-reporting/repo-usage.json
            ossf-reporting/repo-stars-forks.json
          body: |
            Automated update of the OpenSSF Scorecard report, dependents, stars and forks, and the
            repository table in the [organization profile README](${{ github.server_url }}/${{ github.repository }}/blob/main/profile/README.md)
            for the repositories in `ossf-reporting/scope.json`.

            ---
            _Generated by the [OpenSSF Scorecard Monitor](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow_
          branch: automated/update-ossf-report
          delete-branch: true
          labels: automation

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: gh pr merge --auto --merge "$PR_URL"