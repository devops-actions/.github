name: Validate npm Token

on:
  workflow_dispatch:

  push:
    paths:
      - .github/workflows/validate-npm-token.yml

permissions:
  contents: read

jobs:
  validate-npm-token:
    name: Validate npm token for GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Check if NPM_TOKEN is available
        id: token-check
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            # Secrets are not available in Dependabot-triggered runs unless configured as Dependabot secrets.
            # Skip validation instead of failing: the token itself has not changed.
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::NPM_TOKEN secret is not available in this context (e.g. Dependabot push), skipping validation"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js with GitHub Packages registry
        if: steps.token-check.outputs.available == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@devops-actions'

      - name: Install @devops-actions/actions-marketplace-client
        if: steps.token-check.outputs.available == 'true'
        run: npm install @devops-actions/actions-marketplace-client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
